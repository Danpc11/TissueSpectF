name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # The test suite is deliberately dependency-free: base R only, no
      # Bioconductor. That is what makes this job take a minute instead of
      # fifteen, and what lets the label and spectral cores be checked on any
      # machine without an install step.
      - name: Unit tests
        run: |
          Rscript tests/test_labels.R
          Rscript tests/test_spectrum.R

      # End-to-end run on synthetic data with a known injected peak: catches
      # regressions that unit tests cannot, such as a stage writing a schema the
      # next stage does not read.
      # Every stage is invoked through the real CLI, not through the test
      # harness: a module missing from the load path fails here and nowhere
      # else, because the unit tests source what they need explicitly.
      - name: CLI reaches every stage
        run: |
          ./tsf --help > /dev/null
          for s in ingest spectra maxt condition consensus clean stability peaks compare; do
            ./tsf run --to "$s" --dry-run > /dev/null || exit 1
          done

      - name: Self-check
        env:
          TSF_MAXT_B: '100'
          TSF_CONDITION_B: '500'
        run: ./tsf selfcheck
